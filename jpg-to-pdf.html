<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JPG to PDF Converter - Novix Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    text-align: center;
}

h1 {
    margin-top: 0;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

input[type="file"] {
    width: 100%;
    padding: 15px;
    border: 2px dashed #aaa;
    border-radius: 10px;
    background: #fafafa;
    cursor: pointer;
}

.buttons {
    margin-top: 20px;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

.convert {
    background: #111;
    color: white;
}

.clear {
    background: #e9e9e9;
    color: #222;
}

.convert:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#preview {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-top: 25px;
}

.preview-item {
    background: #f2f2f2;
    padding: 10px;
    border-radius: 10px;
}

.preview-item img {
    width: 100%;
    height: 130px;
    object-fit: contain;
    background: white;
    border-radius: 8px;
}

.filename {
    font-size: 12px;
    margin-top: 8px;
    word-break: break-word;
    color: #555;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

.back {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    color: #111;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>JPG to PDF Converter</h1>

<p class="subtitle">
Convert JPG, PNG and WEBP images into a PDF
</p>

<input
    type="file"
    id="imageInput"
    accept="image/jpeg,image/png,image/webp"
    multiple
>

<div id="preview"></div>

<div class="buttons">

<button
    class="convert"
    id="convertBtn"
>
    Convert to PDF
</button>

<button
    class="clear"
    id="clearBtn"
>
    Clear
</button>

</div>

<div id="status"></div>

<a class="back" href="index.html">
← Back to Novix Tool
</a>

</div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const convertBtn = document.getElementById("convertBtn");
const clearBtn = document.getElementById("clearBtn");
const status = document.getElementById("status");

let selectedFiles = [];


/* Select Images */

imageInput.addEventListener("change", function() {

    selectedFiles = Array.from(this.files);

    preview.innerHTML = "";
    status.textContent = "";

    selectedFiles.forEach(function(file) {

        const reader = new FileReader();

        reader.onload = function(event) {

            const item = document.createElement("div");

            item.className = "preview-item";

            item.innerHTML = `
                <img src="${event.target.result}">
                <div class="filename">
                    ${file.name}
                </div>
            `;

            preview.appendChild(item);

        };

        reader.readAsDataURL(file);

    });

});


/* Load Image */

function loadImage(file) {

    return new Promise(function(resolve, reject) {

        const reader = new FileReader();

        reader.onload = function(event) {

            const img = new Image();

            img.onload = function() {
                resolve(img);
            };

            img.onerror = function() {
                reject("Image could not be loaded");
            };

            img.src = event.target.result;

        };

        reader.onerror = function() {
            reject("File could not be read");
        };

        reader.readAsDataURL(file);

    });

}


/* Convert to PDF */

convertBtn.addEventListener("click", async function() {

    if (selectedFiles.length === 0) {

        alert("Please select at least one image.");

        return;
    }

    convertBtn.disabled = true;

    status.textContent = "Creating PDF...";

    try {

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });


        for (let i = 0; i < selectedFiles.length; i++) {

            const img = await loadImage(selectedFiles[i]);

            const canvas = document.createElement("canvas");

            const ctx = canvas.getContext("2d");

            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;


            /* White Background */

            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* Draw Image */

            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );


            const imageData =
                canvas.toDataURL(
                    "image/jpeg",
                    0.92
                );


            /* New Page */

            if (i > 0) {
                pdf.addPage();
            }


            /* A4 Size */

            const pageWidth = 210;
            const pageHeight = 297;

            const margin = 10;

            const maxWidth =
                pageWidth - (margin * 2);

            const maxHeight =
                pageHeight - (margin * 2);


            /* Keep Image Ratio */

            const imageRatio =
                canvas.width / canvas.height;

            let width = maxWidth;

            let height =
                width / imageRatio;


            if (height > maxHeight) {

                height = maxHeight;

                width =
                    height * imageRatio;

            }


            /* Center Image */

            const x =
                (pageWidth - width) / 2;

            const y =
                (pageHeight - height) / 2;


            /* Add Image */

            pdf.addImage(
                imageData,
                "JPEG",
                x,
                y,
                width,
                height
            );

        }


        /* Download */

        pdf.save("Novix-Tool-Images.pdf");

        status.textContent =
            "✅ PDF downloaded successfully!";

    }

    catch(error) {

        console.error(error);

        status.textContent =
            "❌ Something went wrong. Please try again.";

    }

    convertBtn.disabled = false;

});


/* Clear */

clearBtn.addEventListener("click", function() {

    selectedFiles = [];

    imageInput.value = "";

    preview.innerHTML = "";

    status.textContent = "";

});

</script>

</body>
</html>
