<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JPG to PDF Converter - Novix Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #222;
    }

    .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
    }

    .box {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        color: #111;
    }

    p {
        color: #666;
    }

    input[type="file"] {
        width: 100%;
        padding: 15px;
        margin: 20px 0;
        border: 2px dashed #bbb;
        border-radius: 10px;
        background: #fafafa;
    }

    button {
        border: none;
        padding: 13px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin: 6px;
    }

    .convert {
        background: #111;
        color: white;
    }

    .clear {
        background: #eee;
        color: #222;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    #preview {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 15px;
        margin-top: 20px;
    }

    .preview-item {
        background: #f3f3f3;
        padding: 10px;
        border-radius: 10px;
    }

    .preview-item img {
        width: 100%;
        height: 120px;
        object-fit: contain;
        border-radius: 8px;
        background: white;
    }

    .filename {
        font-size: 12px;
        margin-top: 8px;
        word-break: break-word;
        color: #555;
    }

    #status {
        margin-top: 15px;
        font-weight: bold;
    }

    .back {
        display: inline-block;
        margin-top: 20px;
        text-decoration: none;
        color: #111;
    }
</style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>JPG to PDF Converter</h1>

        <p>Convert your JPG, PNG or WEBP images into a PDF.</p>

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
            multiple
        >

        <div id="preview"></div>

        <div>
            <button class="convert" id="convertBtn" disabled>
                Convert to PDF
            </button>

            <button class="clear" id="clearBtn">
                Clear
            </button>
        </div>

        <div id="status"></div>

        <a class="back" href="index.html">← Back to Novix Tool</a>

    </div>

</div>

<script>
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const convertBtn = document.getElementById("convertBtn");
const clearBtn = document.getElementById("clearBtn");
const status = document.getElementById("status");

let selectedFiles = [];

imageInput.addEventListener("change", function () {

    selectedFiles = Array.from(this.files);

    preview.innerHTML = "";
    status.textContent = "";

    if (selectedFiles.length === 0) {
        convertBtn.disabled = true;
        return;
    }

    selectedFiles.forEach(file => {

        const reader = new FileReader();

        reader.onload = function(e) {

            const item = document.createElement("div");
            item.className = "preview-item";

            item.innerHTML = `
                <img src="${e.target.result}">
                <div class="filename">${file.name}</div>
            `;

            preview.appendChild(item);
        };

        reader.readAsDataURL(file);
    });

    convertBtn.disabled = false;
});

function loadImage(file) {
    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = function(e) {

            const img = new Image();

            img.onload = function() {
                resolve(img);
            };

            img.onerror = reject;

            img.src = e.target.result;
        };

        reader.onerror = reject;

        reader.readAsDataURL(file);
    });
}

convertBtn.addEventListener("click", async function () {

    if (selectedFiles.length === 0) return;

    convertBtn.disabled = true;
    status.textContent = "Creating PDF...";

    try {

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });

        for (let i = 0; i < selectedFiles.length; i++) {

            const img = await loadImage(selectedFiles[i]);

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;

            // White background for transparent images
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(img, 0, 0);

            const imageData = canvas.toDataURL("image/jpeg", 0.92);

            if (i > 0) {
                pdf.addPage();
            }

            const pageWidth = 210;
            const pageHeight = 297;
            const margin = 10;

            const maxWidth = pageWidth - margin * 2;
            const maxHeight = pageHeight - margin * 2;

            const imageRatio = canvas.width / canvas.height;

            let width = maxWidth;
            let height = width / imageRatio;

            if (height > maxHeight) {
                height = maxHeight;
                width = height * imageRatio;
            }

            const x = (pageWidth - width) / 2;
            const y = (pageHeight - height) / 2;

            pdf.addImage(
                imageData,
                "JPEG",
                x,
                y,
                width,
                height
            );
        }

        pdf.save("novix-images.pdf");

        status.textContent = "✅ PDF downloaded successfully!";

    } catch (error) {

        console.error(error);
        status.textContent = "❌ Something went wrong. Please try again.";

    }

    convertBtn.disabled = false;
});

clearBtn.addEventListener("click", function () {

    selectedFiles = [];
    imageInput.value = "";
    preview.innerHTML = "";
    status.textContent = "";
    convertBtn.disabled = true;

});
</script>

</body>
  </html>
