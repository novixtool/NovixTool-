<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - Novix Tool</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  margin:0;
  padding:20px;
  text-align:center;
}

.box{
  max-width:500px;
  margin:40px auto;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1{margin-bottom:10px}

input{
  margin:20px 0;
  max-width:100%;
}

#preview{
  display:none;
  max-width:100%;
  max-height:300px;
  margin:15px auto;
  border-radius:10px;
}

button{
  background:#111827;
  color:white;
  border:0;
  padding:12px 22px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  margin:10px;
}

button:disabled{
  opacity:.5;
}

#compressBtn,
#downloadBtn,
#info{
  display:none;
}

a{
  color:#111827;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>Image Compressor</h1>

<p>Compress your image easily and download it.</p>

<input type="file" id="imageInput" accept="image/*">

<img id="preview">

<p id="info"></p>

<button id="compressBtn">Compress Image</button>

<button id="downloadBtn">Download Compressed Image</button>

<br>

<a href="index.html">← Back to Novix Tool</a>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const compressBtn = document.getElementById("compressBtn");
const downloadBtn = document.getElementById("downloadBtn");
const info = document.getElementById("info");

let selectedFile = null;
let compressedBlob = null;

imageInput.addEventListener("change", function(){

  selectedFile = this.files[0];

  if(!selectedFile){
    return;
  }

  preview.src = URL.createObjectURL(selectedFile);
  preview.style.display = "block";

  info.style.display = "block";
  info.innerHTML =
    "Original size: " +
    (selectedFile.size / 1024).toFixed(1) +
    " KB";

  compressBtn.style.display = "inline-block";
  downloadBtn.style.display = "none";
  compressedBlob = null;

});

compressBtn.addEventListener("click", function(){

  if(!selectedFile){
    alert("Please select an image first.");
    return;
  }

  const img = new Image();

  img.onload = function(){

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    let width = img.width;
    let height = img.height;

    const maxWidth = 1200;

    if(width > maxWidth){

      height = height * (maxWidth / width);
      width = maxWidth;

    }

    canvas.width = width;
    canvas.height = height;

    ctx.drawImage(img,0,0,width,height);

    canvas.toBlob(function(blob){

      compressedBlob = blob;

      info.innerHTML =
        "Original: " +
        (selectedFile.size / 1024).toFixed(1) +
        " KB<br>" +
        "Compressed: " +
        (blob.size / 1024).toFixed(1) +
        " KB";

      downloadBtn.style.display = "inline-block";

    },"image/jpeg",0.6);

  };

  img.src = URL.createObjectURL(selectedFile);

});

downloadBtn.addEventListener("click", function(){

  if(!compressedBlob){
    alert("Please compress the image first.");
    return;
  }

  const url = URL.createObjectURL(compressedBlob);

  const link = document.createElement("a");

  link.href = url;
  link.download = "novix-compressed-image.jpg";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  URL.revokeObjectURL(url);

});

</script>

</body>
</html>
