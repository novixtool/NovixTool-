<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Background Remover - Novix Tool</title>
    <meta name="description" content="Remove image backgrounds online for free with Novix Tool.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070b17;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #2563eb;
            filter: blur(180px);
            opacity: 0.15;
            top: -200px;
            left: -180px;
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #7c3aed;
            filter: blur(180px);
            opacity: 0.12;
            right: -200px;
            bottom: -200px;
            pointer-events: none;
            z-index: -1;
        }

        header {
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(7,11,23,0.75);
            backdrop-filter: blur(15px);
        }

        .navbar {
            max-width: 1150px;
            margin: auto;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
        }

        .logo span {
            color: #4f8cff;
        }

        .home-btn {
            color: #9dbaff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 70px 20px 90px;
            text-align: center;
        }

        .tag {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid rgba(79,140,255,0.3);
            background: rgba(37,99,235,0.10);
            color: #8db5ff;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 58px);
            margin-bottom: 15px;
            letter-spacing: -2px;
        }

        .gradient {
            background: linear-gradient(90deg, #4f8cff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #9ca8bd;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .tool-box {
            padding: 35px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.09);
            background: rgba(255,255,255,0.045);
            backdrop-filter: blur(12px);
        }

        .upload-area {
            border: 2px dashed rgba(79,140,255,0.35);
            border-radius: 16px;
            padding: 45px 20px;
            cursor: pointer;
            transition: 0.25s;
        }

        .upload-area:hover {
            border-color: #4f8cff;
            background: rgba(37,99,235,0.06);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-area h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #7f8ba3;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            margin-top: 25px;
            color: #9ca8bd;
            font-size: 14px;
            min-height: 22px;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid rgba(255,255,255,0.12);
            border-top-color: #4f8cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 18px auto;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            display: none;
            margin-top: 30px;
        }

        .result h3 {
            margin-bottom: 15px;
        }

        .preview {
            min-height: 250px;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.08);

            background-image:
                linear-gradient(45deg, #202633 25%, transparent 25%),
                linear-gradient(-45deg, #202633 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #202633 75%),
                linear-gradient(-45deg, transparent 75%, #202633 75%);

            background-size: 30px 30px;
            background-position: 0 0, 0 15px, 15px -15px, -15px 0;
        }

        .preview img {
            max-width: 100%;
            max-height: 450px;
            display: block;
            margin: auto;
            border-radius: 8px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            text-decoration: none;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37,99,235,0.25);
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .note {
            margin-top: 20px;
            color: #68758c;
            font-size: 12px;
            line-height: 1.5;
        }

        footer {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 30px 20px;
            text-align: center;
            color: #69758b;
        }

        footer strong {
            color: white;
        }

        @media (max-width: 560px) {
            .navbar {
                padding: 16px;
            }

            .container {
                padding: 55px 15px 70px;
            }

            .tool-box {
                padding: 25px 15px;
            }

            .upload-area {
                padding: 40px 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="navbar">
        <a href="index.html" class="logo">
            Novix <span>Tool</span>
        </a>

        <a href="index.html" class="home-btn">
            ← Home
        </a>
    </div>
</header>

<main class="container">

    <div class="tag">
        ✨ FREE IMAGE TOOL
    </div>

    <h1>
        Background <span class="gradient">Remover</span>
    </h1>

    <p class="subtitle">
        Remove image backgrounds quickly and easily.
        Download your image with a transparent background.
    </p>

    <div class="tool-box">

        <label for="imageInput" class="upload-area">

            <div class="upload-icon">
                🪄
            </div>

            <h2>
                Upload Your Image
            </h2>

            <p>
                Click here to choose JPG, PNG or WEBP
            </p>

        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/png,image/jpeg,image/webp"
        >

        <div class="status" id="status"></div>

        <div class="loader" id="loader"></div>

        <div class="result" id="result">

            <h3>
                ✨ Background Removed
            </h3>

            <div class="preview">
                <img id="resultImage" alt="Background removed image">
            </div>

            <a
                id="downloadBtn"
                class="download-btn"
                download="novix-background-removed.png"
            >
                ⬇ Download PNG
            </a>

        </div>

        <div class="note">
            Your image is processed in your browser. No upload form is required.
        </div>

    </div>

</main>

<footer>
    © 2026 <strong>Novix Tool</strong>. All Rights Reserved.
</footer>


<!-- Background Removal Library -->

<script type="module">

    import { removeBackground } from
    "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";


    const imageInput = document.getElementById("imageInput");
    const status = document.getElementById("status");
    const loader = document.getElementById("loader");
    const result = document.getElementById("result");
    const resultImage = document.getElementById("resultImage");
    const downloadBtn = document.getElementById("downloadBtn");


    imageInput.addEventListener("change", async function () {

        const file = this.files[0];

        if (!file) {
            return;
        }


        result.style.display = "none";

        loader.style.display = "block";

        status.textContent =
            "Preparing image... Please wait.";


        try {

            status.textContent =
                "Removing background...";


            const blob = await removeBackground(file);


            const url = URL.createObjectURL(blob);


            resultImage.src = url;

            downloadBtn.href = url;


            loader.style.display = "none";

            status.textContent =
                "Background removed successfully!";


            result.style.display = "block";


        } catch (error) {

            console.error(error);

            loader.style.display = "none";

            status.textContent =
                "Something went wrong. Please try another image.";

        }

    });

</script>

</body>
  </html>
