<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator - Novix Tool</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  max-width:600px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  margin-bottom:25px;
}

textarea{
  width:100%;
  min-height:120px;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  resize:vertical;
}

button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  background:#111827;
  color:white;
  font-size:17px;
  cursor:pointer;
}

#qrBox{
  display:none;
  text-align:center;
  margin-top:25px;
}

#qrImage{
  width:250px;
  max-width:100%;
  border:10px solid white;
  box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#111827;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>QR Code Generator</h1>

<p class="subtitle">
Create a QR code from any text or URL.
</p>

<textarea
id="text"
placeholder="Enter text or paste a URL here..."
></textarea>

<button id="generateBtn">
Generate QR Code
</button>

<div id="qrBox">

<img id="qrImage" alt="Generated QR Code">

<button id="downloadBtn">
Download QR Code
</button>

</div>

<a class="back" href="index.html">
← Back to Novix Tool
</a>

</div>

</div>

<script>

const textInput =
document.getElementById("text");

const generateBtn =
document.getElementById("generateBtn");

const qrBox =
document.getElementById("qrBox");

const qrImage =
document.getElementById("qrImage");

const downloadBtn =
document.getElementById("downloadBtn");


generateBtn.addEventListener("click", function(){

  const text =
  textInput.value.trim();

  if(!text){

    alert("Please enter some text or a URL.");

    return;

  }

  const qrUrl =
  "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="
  + encodeURIComponent(text);

  qrImage.src = qrUrl;

  qrBox.style.display = "block";

});


downloadBtn.addEventListener("click", function(){

  const link =
  document.createElement("a");

  link.href = qrImage.src;

  link.download =
  "novix-qr-code.png";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

});

</script>

</body>
</html>
