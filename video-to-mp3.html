<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video to MP3 Converter - Novix Tool</title>

  <meta
    name="description"
    content="Convert video to MP3 online for free with Novix Tool."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #172554 0%, transparent 35%),
        radial-gradient(circle at bottom right, #3b0764 0%, transparent 35%),
        #070b17;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    .top {
      text-align: center;
      padding: 35px 0 25px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .logo span {
      color: #7c8cff;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #aab3c5;
      line-height: 1.6;
      font-size: 16px;
    }

    .card {
      background: rgba(17, 24, 39, 0.80);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
    }

    .upload {
      display: block;
      border: 2px dashed #4652a5;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
    }

    .upload:hover {
      border-color: #7c8cff;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #929bb0;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 13px;
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .video-box {
      display: none;
      margin-top: 20px;
    }

    video {
      width: 100%;
      max-height: 360px;
      border-radius: 15px;
      background: black;
    }

    .progress-wrap {
      display: none;
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #20283b;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4f7cff, #a855f7);
      transition: width .2s;
    }

    .progress-text {
      text-align: center;
      color: #aab3c5;
      margin-top: 9px;
      font-size: 13px;
    }

    .buttons {
      display: none;
      gap: 12px;
      margin-top: 22px;
    }

    button,
    .download {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .convert {
      background: linear-gradient(90deg, #4f7cff, #8b5cf6);
      color: white;
    }

    .convert:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .reset {
      background: #20283b;
      color: white;
    }

    .download {
      display: none;
      margin-top: 15px;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
    }

    .note {
      margin-top: 22px;
      color: #7f8aa3;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #9aa7ff;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">

    <div class="logo">
      Novix <span>Tool</span>
    </div>

    <h1>Video to MP3</h1>

    <p class="subtitle">
      Convert your video into an MP3 audio file quickly and easily.
    </p>

  </div>

  <div class="card">

    <label class="upload" for="videoInput">

      <div class="upload-icon">
        🎥
      </div>

      <div class="upload-title">
        Select a Video
      </div>

      <div class="upload-text">
        MP4, MOV, WEBM and other common video formats
      </div>

    </label>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >

    <div class="status" id="status">
      👆 Select a video to start
    </div>

    <div class="video-box" id="videoBox">

      <video
        id="videoPreview"
        controls
        playsinline
      ></video>

    </div>

    <div class="progress-wrap" id="progressWrap">

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>

      <div class="progress-text" id="progressText">
        0%
      </div>

    </div>

    <div class="buttons" id="buttons">

      <button
        class="convert"
        id="convertBtn"
      >
        🎵 Convert to MP3
      </button>

      <button
        class="reset"
        id="resetBtn"
      >
        🔄 Reset
      </button>

    </div>

    <a
      id="downloadBtn"
      class="download"
      download="Novix-Tool-Audio.mp3"
    >
      ⬇️ Download MP3
    </a>

    <div class="note">
      Your video is processed directly in your browser.
      It is not uploaded to our server.
    </div>

  </div>

  <a
    class="back"
    href="index.html"
  >
    ← Back to Novix Tool
  </a>

</div>


<!-- =========================================
     FFmpeg.js
     Files are in the GitHub repository root
========================================= -->

<script src="./ffmpeg-mp4.js"></script>


<script>

const videoInput =
  document.getElementById("videoInput");

const status =
  document.getElementById("status");

const videoBox =
  document.getElementById("videoBox");

const videoPreview =
  document.getElementById("videoPreview");

const buttons =
  document.getElementById("buttons");

const convertBtn =
  document.getElementById("convertBtn");

const resetBtn =
  document.getElementById("resetBtn");

const progressWrap =
  document.getElementById("progressWrap");

const progress =
  document.getElementById("progress");

const progressText =
  document.getElementById("progressText");

const downloadBtn =
  document.getElementById("downloadBtn");


let selectedFile = null;
let outputUrl = null;
let ffmpeg = null;


/* =========================================
   Select Video
========================================= */

videoInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) {
    return;
  }

  selectedFile = file;

  if (outputUrl) {
    URL.revokeObjectURL(outputUrl);
    outputUrl = null;
  }

  downloadBtn.style.display = "none";

  const videoURL =
    URL.createObjectURL(file);

  videoPreview.src = videoURL;

  videoBox.style.display = "block";

  buttons.style.display = "flex";

  progressWrap.style.display = "none";

  progress.style.width = "0%";

  progressText.textContent = "0%";

  status.innerHTML =
    "📂 Video selected:<br>" +
    "<b>" +
    file.name +
    "</b><br><br>" +
    "Ready to convert.";

});


/* =========================================
   Convert Video to MP3
========================================= */

convertBtn.addEventListener("click", async function () {

  if (!selectedFile) {

    status.innerHTML =
      "❌ Please select a video first.";

    return;

  }

  try {

    convertBtn.disabled = true;
    resetBtn.disabled = true;

    progressWrap.style.display = "block";

    progress.style.width = "0%";

    progressText.textContent =
      "Loading converter...";


    /* -------------------------------------
       Check FFmpeg.js
    ------------------------------------- */

    if (typeof FFmpeg === "undefined") {

      throw new Error(
        "FFmpeg library not found."
      );

    }


    status.innerHTML =
      "📦 Loading video converter...<br>" +
      "Please wait...";


    /*
      Create FFmpeg instance.
    */

    ffmpeg = new FFmpeg();


    /*
      FFmpeg progress event.
    */

    if (typeof ffmpeg.setProgress === "function") {

      ffmpeg.setProgress(function (progressValue) {

        const percent =
          Math.max(
            0,
            Math.min(
              100,
              Math.round(progressValue * 100)
            )
          );

        progress.style.width =
          percent + "%";

        progressText.textContent =
          "Converting... " +
          percent +
          "%";

      });

    }


    status.innerHTML =
      "📥 Reading your video...";


    /*
      Read video file.
    */

    const arrayBuffer =
      await selectedFile.arrayBuffer();


    const inputName =
      "input_video";


    const outputName =
      "novix_audio.mp3";


    /*
      Write video into FFmpeg.
    */

    ffmpeg.FS(
      "writeFile",
      inputName,
      new Uint8Array(arrayBuffer)
    );


    status.innerHTML =
      "🎵 Converting video to MP3...";


    progress.style.width =
      "10%";

    progressText.textContent =
      "Converting... 10%";


    /*
      Convert video audio to MP3.
    */

    await ffmpeg.run(

      "-i",
      inputName,

      "-vn",

      "-map",
      "0:a:0",

      "-codec:a",
      "libmp3lame",

      "-b:a",
      "192k",

      "-ar",
      "44100",

      outputName

    );


    progress.style.width =
      "90%";

    progressText.textContent =
      "Preparing MP3...";


    status.innerHTML =
      "📦 Preparing MP3 download...";


    /*
      Read MP3 output.
    */

    const data =
      ffmpeg.FS(
        "readFile",
        outputName
      );


    const blob =
      new Blob(
        [data.buffer],
        {
          type: "audio/mpeg"
        }
      );


    outputUrl =
      URL.createObjectURL(blob);


    downloadBtn.href =
      outputUrl;


    downloadBtn.style.display =
      "block";


    progress.style.width =
      "100%";

    progressText.textContent =
      "100% Complete";


    status.innerHTML =
      "✅ <b>Conversion complete!</b><br>" +
      "Your MP3 is ready to download.";


    /*
      Clean FFmpeg files.
    */

    try {

      ffmpeg.FS(
        "unlink",
        inputName
      );

      ffmpeg.FS(
        "unlink",
        outputName
      );

    } catch (cleanupError) {

      console.log(
        "Cleanup:",
        cleanupError
      );

    }

  }

  catch (error) {

    console.error(
      "FFmpeg error:",
      error
    );


    status.innerHTML =
      "❌ <b>Conversion failed.</b><br><br>" +
      "This video may not contain an audio track, " +
      "or the format may not be supported.<br><br>" +
      "Try another MP4 video.";


    progress.style.width =
      "0%";

    progressText.textContent =
      "Conversion failed";

  }


  convertBtn.disabled =
    false;

  resetBtn.disabled =
    false;

});


/* =========================================
   Reset
========================================= */

resetBtn.addEventListener("click", function () {

  if (outputUrl) {

    URL.revokeObjectURL(
      outputUrl
    );

    outputUrl = null;

  }


  selectedFile = null;

  videoInput.value = "";


  videoPreview.removeAttribute(
    "src"
  );

  videoPreview.load();


  videoBox.style.display =
    "none";


  buttons.style.display =
    "none";


  progressWrap.style.display =
    "none";


  downloadBtn.style.display =
    "none";


  progress.style.width =
    "0%";


  progressText.textContent =
    "0%";


  status.innerHTML =
    "👆 Select a video to start";

});

</script>

</body>
</html>
