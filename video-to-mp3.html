<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video to MP3 Converter - Novix Tool</title>

  <meta
    name="description"
    content="Convert video to MP3 online for free with Novix Tool."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #172554 0%, transparent 35%),
        radial-gradient(circle at bottom right, #3b0764 0%, transparent 35%),
        #070b17;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    .top {
      text-align: center;
      padding: 35px 0 25px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .logo span {
      color: #7c8cff;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #aab3c5;
      line-height: 1.6;
      font-size: 16px;
    }

    .card {
      background: rgba(17, 24, 39, 0.80);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
    }

    .upload {
      display: block;
      border: 2px dashed #4652a5;
      border-radius: 18px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
    }

    .upload:hover {
      border-color: #7c8cff;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #929bb0;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 13px;
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .video-box {
      display: none;
      margin-top: 20px;
    }

    video {
      width: 100%;
      max-height: 360px;
      border-radius: 15px;
      background: black;
    }

    .progress-wrap {
      display: none;
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #20283b;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #4f7cff, #a855f7);
      transition: width .2s;
    }

    .progress-text {
      text-align: center;
      color: #aab3c5;
      margin-top: 9px;
      font-size: 13px;
    }

    .buttons {
      display: none;
      gap: 12px;
      margin-top: 22px;
    }

    button,
    .download {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .convert {
      background: linear-gradient(90deg, #4f7cff, #8b5cf6);
      color: white;
    }

    .convert:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .reset {
      background: #20283b;
      color: white;
    }

    .download {
      display: none;
      margin-top: 15px;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
    }

    .note {
      margin-top: 22px;
      color: #7f8aa3;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #9aa7ff;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="top">

    <div class="logo">
      Novix <span>Tool</span>
    </div>

    <h1>Video to MP3</h1>

    <p class="subtitle">
      Convert your video into an MP3 audio file quickly and easily.
    </p>

  </div>


  <div class="card">

    <label class="upload" for="videoInput">

      <div class="upload-icon">
        🎥
      </div>

      <div class="upload-title">
        Select a Video
      </div>

      <div class="upload-text">
        MP4, MOV, WEBM and other common video formats
      </div>

    </label>


    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >


    <div class="status" id="status">
      👆 Select a video to start
    </div>


    <div class="video-box" id="videoBox">

      <video
        id="videoPreview"
        controls
        playsinline
      ></video>

    </div>


    <div class="progress-wrap" id="progressWrap">

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>

      <div class="progress-text" id="progressText">
        0%
      </div>

    </div>


    <div class="buttons" id="buttons">

      <button
        class="convert"
        id="convertBtn"
      >
        🎵 Convert to MP3
      </button>

      <button
        class="reset"
        id="resetBtn"
      >
        🔄 Reset
      </button>

    </div>


    <a
      id="downloadBtn"
      class="download"
      download="Novix-Tool-Audio.mp3"
    >
      ⬇️ Download MP3
    </a>


    <div class="note">
      Your video is processed directly in your browser.
      It is not uploaded to our server.
    </div>

  </div>


  <a
    class="back"
    href="index.html"
  >
    ← Back to Novix Tool
  </a>

</div>


<!-- =========================================
     FFmpeg.js
     Both files are in repository root
========================================= -->

<script src="./ffmpeg-mp4.js"></script>


<script>

const videoInput =
  document.getElementById("videoInput");

const status =
  document.getElementById("status");

const videoBox =
  document.getElementById("videoBox");

const videoPreview =
  document.getElementById("videoPreview");

const buttons =
  document.getElementById("buttons");

const convertBtn =
  document.getElementById("convertBtn");

const resetBtn =
  document.getElementById("resetBtn");

const progressWrap =
  document.getElementById("progressWrap");

const progress =
  document.getElementById("progress");

const progressText =
  document.getElementById("progressText");

const downloadBtn =
  document.getElementById("downloadBtn");


let selectedFile = null;
let outputUrl = null;
let worker = null;


/* =========================================
   Select Video
========================================= */

videoInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) {
    return;
  }

  selectedFile = file;


  if (outputUrl) {

    URL.revokeObjectURL(outputUrl);

    outputUrl = null;

  }


  downloadBtn.style.display = "none";


  const videoURL =
    URL.createObjectURL(file);


  videoPreview.src =
    videoURL;


  videoBox.style.display =
    "block";


  buttons.style.display =
    "flex";


  progressWrap.style.display =
    "none";


  progress.style.width =
    "0%";


  progressText.textContent =
    "0%";


  status.innerHTML =
    "📂 Video selected:<br>" +
    "<b>" +
    file.name +
    "</b><br><br>" +
    "Ready to convert.";

});


/* =========================================
   Convert Video to MP3
========================================= */

convertBtn.addEventListener("click", async function () {

  if (!selectedFile) {

    status.innerHTML =
      "❌ Please select a video first.";

    return;

  }


  convertBtn.disabled =
    true;

  resetBtn.disabled =
    true;


  progressWrap.style.display =
    "block";


  progress.style.width =
    "0%";


  progressText.textContent =
    "Starting converter...";


  status.innerHTML =
    "📦 Starting video converter...";


  try {

    /*
      Read selected video
    */

    const buffer =
      await selectedFile.arrayBuffer();


    const videoData =
      new Uint8Array(buffer);


    /*
      Create FFmpeg worker
    */

    worker =
      new Worker(
        "./ffmpeg-worker-mp4.js"
      );


    worker.onmessage =
      function (event) {

        const message =
          event.data;


        /*
          FFmpeg console output
        */

        if (message.type === "stdout") {

          const text =
            message.data || "";

          console.log(text);


          /*
            Try to detect FFmpeg progress
          */

          const match =
            text.match(
              /time=\s*([0-9:.]+)/i
            );


          if (match) {

            progress.style.width =
              "50%";

            progressText.textContent =
              "Converting...";

          }

        }


        /*
          FFmpeg error/output
        */

        if (message.type === "stderr") {

          console.log(
            "FFmpeg:",
            message.data
          );

        }


        /*
          Conversion finished
        */

        if (message.type === "done") {

          try {

            const files =
              message.data &&
              message.data.MEMFS;


            if (!files || !files.length) {

              throw new Error(
                "No output file was created."
              );

            }


            /*
              Find MP3 output
            */

            let mp3File =
              null;


            for (
              let i = 0;
              i < files.length;
              i++
            ) {

              if (
                files[i].name ===
                "novix_audio.mp3"
              ) {

                mp3File =
                  files[i];

                break;

              }

            }


            /*
              Fallback to first output
            */

            if (!mp3File) {

              for (
                let i = 0;
                i < files.length;
                i++
              ) {

                if (
                  files[i].name
                    .toLowerCase()
                    .endsWith(".mp3")
                ) {

                  mp3File =
                    files[i];

                  break;

                }

              }

            }


            if (!mp3File) {

              throw new Error(
                "MP3 output not found."
              );

            }


            /*
              Create MP3 blob
            */

            const blob =
              new Blob(
                [mp3File.data],
                {
                  type: "audio/mpeg"
                }
              );


            outputUrl =
              URL.createObjectURL(
                blob
              );


            downloadBtn.href =
              outputUrl;


            downloadBtn.style.display =
              "block";


            progress.style.width =
              "100%";


            progressText.textContent =
              "100% Complete";


            status.innerHTML =
              "✅ <b>Conversion complete!</b><br>" +
              "Your MP3 is ready to download.";


            /*
              Stop worker
            */

            worker.terminate();

            worker = null;


          }
          catch (error) {

            console.error(error);

            status.innerHTML =
              "❌ <b>Conversion failed.</b><br><br>" +
              "MP3 file could not be created.";

          }


          convertBtn.disabled =
            false;

          resetBtn.disabled =
            false;

        }

      };


    worker.onerror =
      function (error) {

        console.error(
          "Worker error:",
          error
        );


        status.innerHTML =
          "❌ <b>Conversion failed.</b><br><br>" +
          "FFmpeg could not process this video.";


        progress.style.width =
          "0%";


        progressText.textContent =
          "Conversion failed";


        convertBtn.disabled =
          false;

        resetBtn.disabled =
          false;


        if (worker) {

          worker.terminate();

          worker = null;

        }

      };


    /*
      Start FFmpeg
    */

    progress.style.width =
      "10%";

    progressText.textContent =
      "Reading video...";


    status.innerHTML =
      "📥 Reading your video...";


    worker.postMessage({

      type: "run",

      arguments: [

        "-i",
        "input_video.mp4",

        "-vn",

        "-map",
        "0:a:0",

        "-codec:a",
        "libmp3lame",

        "-b:a",
        "192k",

        "-ar",
        "44100",

        "novix_audio.mp3"

      ],

      MEMFS: [

        {
          name: "input_video.mp4",
          data: videoData
        }

      ]

    });


    status.innerHTML =
      "🎵 <b>Converting video to MP3...</b>";


    progress.style.width =
      "20%";

    progressText.textContent =
      "Converting...";


  }
  catch (error) {

    console.error(
      "Conversion error:",
      error
    );


    status.innerHTML =
      "❌ <b>Conversion failed.</b><br><br>" +
      "Try a smaller MP4 video.";


    progress.style.width =
      "0%";


    progressText.textContent =
      "Conversion failed";


    convertBtn.disabled =
      false;

    resetBtn.disabled =
      false;

  }

});


/* =========================================
   Reset
========================================= */

resetBtn.addEventListener("click", function () {

  if (worker) {

    worker.terminate();

    worker = null;

  }


  if (outputUrl) {

    URL.revokeObjectURL(
      outputUrl
    );

    outputUrl = null;

  }


  selectedFile = null;


  videoInput.value =
    "";


  videoPreview.removeAttribute(
    "src"
  );


  videoPreview.load();


  videoBox.style.display =
    "none";


  buttons.style.display =
    "none";


  progressWrap.style.display =
    "none";


  downloadBtn.style.display =
    "none";


  progress.style.width =
    "0%";


  progressText.textContent =
    "0%";


  status.innerHTML =
    "👆 Select a video to start";


  convertBtn.disabled =
    false;


  resetBtn.disabled =
    false;

});

</script>

</body>
  </html>
